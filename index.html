<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur de Primes & Frais Discord</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2f3136;
            color: #dcddde;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #36393f;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 700px;
        }
        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }
        h2 {
            color: #fff;
            border-bottom: 2px solid #5865f2;
            padding-bottom: 8px;
            margin-top: 30px;
            font-size: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #b9bbbe;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            cursor: pointer;
            font-weight: bold;
            color: #b9bbbe;
        }
        .checkbox-container input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        /* Correction de l'alignement ici : Ciblage propre de tous les inputs text, selects et textareas */
        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #202225;
            border: 1px solid #222;
            border-radius: 4px;
            color: #fff;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 14px;
        }
        select option {
            background-color: #2f3136;
            color: #fff;
        }
        textarea {
            resize: vertical;
            min-height: 150px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #5865f2;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #5865f2;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }
        button.btn-frais {
            background-color: #248046;
        }
        button.btn-frais:hover {
            background-color: #1a6535;
        }
        button.btn-calcul {
            background-color: #e67e22;
        }
        button.btn-calcul:hover {
            background-color: #ba6418;
        }
        button.btn-secondaire {
            background-color: #4f545c;
        }
        button.btn-secondaire:hover {
            background-color: #3d4147;
        }
        #resultatFraisCalcules {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #202225;
        }
        button:hover {
            background-color: #4752c4;
        }
        button:disabled {
            background-color: #4f545c;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            display: none;
            white-space: pre-line;
        }
        .success { background-color: #2e7d32; color: #fff; }
        .error { background-color: #d32f2f; color: #fff; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Analyseur Global (Primes & Frais)</h1>
    
    <label for="codeAcces">🔑 Code d'accès Webhook :</label>
    <input type="text" id="codeAcces" placeholder="Chargement des webhooks..." oninput="detecterCode()" disabled>

    <div id="zoneSalons" class="hidden">
        <label for="selectWebhookPrimes">📁 Salon de destination pour les Primes :</label>
        <select id="selectWebhookPrimes"></select>

        <label for="selectWebhookFrais">📁 Salon de destination pour les Frais :</label>
        <select id="selectWebhookFrais"></select>

        <label for="selectWebhookClassement">📁 Salon de destination pour le Classement :</label>
        <select id="selectWebhookClassement"></select>
    </div>

    <label class="checkbox-container">
        <input type="checkbox" id="exclureZeros" checked>
        Masquer les valeurs à 0 (valable pour primes et frais)
    </label>

    <h2>Section 1 : Primes Directeurs</h2>
    <label for="primeMaxBase">💰 Prime Max par poste (ex: 5M, 10G, 5000000) :</label>
    <input type="text" id="primeMaxBase" placeholder="Laissez vide pour désactiver le contrôle">

    <label for="grosTexte">📝 Coller le tableau des Primes ici :</label>
    <textarea id="grosTexte" placeholder="Filiale    Poste    Directeur    Prime Max    Prime..."></textarea>
    <button id="btnEnvoyerPrimes" onclick="traiterEtEnvoyerPrimes()">🚀 Analyser et Envoyer les Primes</button>

    <h2>Section 2 : Frais de Gestion Filiales</h2>
    <label for="texteFrais">🏢 Coller le tableau des Frais de Gestion ici :</label>
    <textarea id="texteFrais" placeholder="Filiale    Frais de gestion&#10;Patrimonia-E.C.T    0&#10;Patrimonia-Isabelle62    656300000000000000..."></textarea>
    <button id="btnEnvoyerFrais" class="btn-frais" onclick="traiterEtEnvoyerFrais()">🚀 Analyser et Envoyer les Frais</button>

    <h2>Section 3 : Calcul des Frais de Gestion (% du Résultat d'exploitation)</h2>
    <label for="texteResultatsFiliales">📈 Coller le tableau des résultats (Filiale, Trésorerie, Résultat d'exploitation, Résultat NET, Bénéfices ou pertes) :</label>
    <textarea id="texteResultatsFiliales" placeholder="Filiale    Trésorerie    Résultat d'exploitation    Résultat NET    Bénéfices ou pertes&#10;Patrimonia-Exemple    1000000    500000    300000    300000"></textarea>

    <label for="pourcentageFrais">🎯 Pourcentage du Résultat d'exploitation à appliquer :</label>
    <input type="text" id="pourcentageFrais" placeholder="Ex : 15 (pour 15%)">

    <button id="btnCalculerFrais" class="btn-calcul" onclick="calculerFraisParPourcentage()">🧮 Calculer les Frais de Gestion</button>

    <div id="zoneResultatCalcul" class="hidden">
        <label for="resultatFraisCalcules">✅ Résultat prêt à être collé dans la fenêtre "Gestion" (format {nom_filiale}{TAB}{frais_de_gestion}) :</label>
        <textarea id="resultatFraisCalcules" readonly></textarea>
        <button id="btnCopierFrais" onclick="copierResultatFrais()">📋 Copier le résultat</button>
        <button id="btnInsererFrais" class="btn-secondaire" onclick="insererDansChampFrais()">➡️ Insérer dans le champ "Frais de gestion" (Section 2)</button>
    </div>

    <h2>Section 4 : Classement par Résultat d'exploitation</h2>
    <label style="font-weight:normal;color:#b9bbbe;font-size:13px;">Utilise le même tableau collé juste au-dessus (Section 3).</label>
    <button id="btnEnvoyerClassement" class="btn-calcul" onclick="genererEtEnvoyerClassement()">🏆 Générer et Envoyer le Classement</button>

    <div id="statusBox" class="status"></div>
</div>

<script>
// --- CHARGEMENT DES WEBHOOKS DEPUIS GITHUB ---
// Les URLs de webhook ne sont plus codées en dur ici : elles vivent dans
// webhook.json, géré depuis Discord via la commande /webhook. Le bot (sur
// Katabump) pousse ce fichier directement sur ce dépôt GitHub à chaque
// modification ; cette page va simplement le relire depuis
// raw.githubusercontent.com (en HTTPS, donc pas de souci de contenu mixte).
//
// ⚠️ À FAIRE : remplace OWNER et REPO ci-dessous par ton pseudo GitHub et le
// nom du dépôt où se trouve ce site (celui utilisé pour GITHUB_REPO côté bot).
// Si webhook.json n'est pas à la racine du dépôt, adapte aussi le chemin.
const URL_WEBHOOKS_JSON = "https://raw.githubusercontent.com/Lordodol/prime-bot/main/webhook.json";

let DICTIONNAIRE_WEBHOOKS = {};

async function chargerDictionnaireWebhooks() {
    const champCode = document.getElementById("codeAcces");
    try {
        // Le paramètre "?t=" force le navigateur à ne pas réutiliser une
        // version en cache. Note : raw.githubusercontent.com est aussi mis
        // en cache côté GitHub (~5 minutes), donc un /webhook ajouter tout
        // récent peut mettre jusqu'à quelques minutes à apparaître ici.
        const reponse = await fetch(`${URL_WEBHOOKS_JSON}?t=${Date.now()}`, { cache: "no-store" });
        if (!reponse.ok) throw new Error(`Statut HTTP ${reponse.status}`);
        DICTIONNAIRE_WEBHOOKS = await reponse.json();

        champCode.disabled = false;
        champCode.placeholder = "Entrez votre code secret (ex: curly)";

        // Si l'utilisateur avait déjà tapé un code pendant le chargement.
        if (champCode.value.trim()) {
            detecterCode();
        }
    } catch (e) {
        console.error("❌ Impossible de charger webhook.json :", e);
        champCode.placeholder = "⚠️ Erreur de chargement des webhooks";
        afficherStatus("❌ Impossible de charger la liste des webhooks. Réessaie plus tard.", "error");
    }
}

chargerDictionnaireWebhooks();

const CONFIG_UNITES = [
    { symbole: 'D', taille: 45 }, { symbole: 'N', taille: 42 }, { symbole: 'X', taille: 39 },
    { symbole: 'S', taille: 36 }, { symbole: 'U', taille: 33 }, { symbole: 'Q', taille: 30 },
    { symbole: 'R', taille: 27 }, { symbole: 'Y', taille: 24 }, { symbole: 'Z', taille: 21 },
    { symbole: 'E', taille: 18 }, { symbole: 'P', taille: 15 }, { symbole: 'T', taille: 12 },
    { symbole: 'G', taille: 9 },  { symbole: 'M', taille: 6 }
];

function convertirEnBigInt(chaine) {
    let nettoye = chaine.trim().toUpperCase().replace(/,/g, '.');
    if (!nettoye || nettoye === '0' || nettoye === '-' || nettoye === '.') return 0n;

    for (const u of CONFIG_UNITES) {
        if (nettoye.endsWith(u.symbole)) {
            let valeurNum = nettoye.slice(0, -1).trim();
            let floatValeur = parseFloat(valeurNum);
            if (isNaN(floatValeur)) return 0n;

            let shift = u.taille;
            if (valeurNum.includes('.')) {
                let decimales = valeurNum.split('.')[1].length;
                floatValeur = floatValeur * Math.pow(10, decimales);
                shift -= decimales;
            }
            if (shift < 0) return BigInt(Math.round(parseFloat(valeurNum) * Math.pow(10, u.taille)));
            return BigInt(Math.round(floatValeur)) * (10n ** BigInt(shift));
        }
    }
    let chiffresSeuls = nettoye.replace(/[^0-9]/g, '');
    return chiffresSeuls ? BigInt(chiffresSeuls) : 0n;
}

function detecterCode() {
    const code = document.getElementById("codeAcces").value.trim();
    const zoneSalons = document.getElementById("zoneSalons");
    const selectWebhookPrimes = document.getElementById("selectWebhookPrimes");
    const selectWebhookFrais = document.getElementById("selectWebhookFrais");
    const selectWebhookClassement = document.getElementById("selectWebhookClassement");
    
    if (DICTIONNAIRE_WEBHOOKS[code]) {
        selectWebhookPrimes.innerHTML = ""; 
        selectWebhookFrais.innerHTML = ""; 
        selectWebhookClassement.innerHTML = "";
        
        let aDesPrimes = false;
        let aDesFrais = false;
        let aDesClassement = false;

        DICTIONNAIRE_WEBHOOKS[code].forEach((salon) => {
            const nomMinuscule = salon.nom.toLowerCase();
            
            if (nomMinuscule.startsWith("prime")) {
                const opt = document.createElement("option");
                opt.value = salon.url;
                opt.textContent = salon.nom;
                selectWebhookPrimes.appendChild(opt);
                aDesPrimes = true;
            }
            
            if (nomMinuscule.startsWith("fdg") || nomMinuscule.startsWith("frais")) {
                const opt = document.createElement("option");
                opt.value = salon.url;
                opt.textContent = salon.nom;
                selectWebhookFrais.appendChild(opt);
                aDesFrais = true;
            }

            if (nomMinuscule.includes("classement")) {
                const opt = document.createElement("option");
                opt.value = salon.url;
                opt.textContent = salon.nom;
                selectWebhookClassement.appendChild(opt);
                aDesClassement = true;
            }
        });

        if (!aDesPrimes || !aDesFrais) {
            DICTIONNAIRE_WEBHOOKS[code].forEach((salon) => {
                if (!aDesPrimes) {
                    const opt = document.createElement("option");
                    opt.value = salon.url; opt.textContent = salon.nom;
                    selectWebhookPrimes.appendChild(opt);
                }
                if (!aDesFrais) {
                    const opt = document.createElement("option");
                    opt.value = salon.url; opt.textContent = salon.nom;
                    selectWebhookFrais.appendChild(opt);
                }
            });
        }

        if (!aDesClassement) {
            selectWebhookClassement.innerHTML = "<option value=''>-- Aucun salon 'classement' trouvé --</option>";
        }
        
        zoneSalons.classList.remove("hidden"); 
    } else {
        zoneSalons.classList.add("hidden"); 
        selectWebhookPrimes.innerHTML = "";
        selectWebhookFrais.innerHTML = "";
        selectWebhookClassement.innerHTML = "";
    }
}

function formaterGrandNombre(chaineNombre) {
    const nette = chaineNombre.replace(/[^0-9]/g, '');
    if (!nette || nette === '0') return "Aucune (0)";
    const longueur = nette.length;

    const unitesFormat = [
        { symbole: 'D', taille: 46 }, { symbole: 'N', taille: 43 }, { symbole: 'X', taille: 40 },
        { symbole: 'S', taille: 37 }, { symbole: 'U', taille: 34 }, { symbole: 'Q', taille: 31 },
        { symbole: 'R', taille: 28 }, { symbole: 'Y', taille: 25 }, { symbole: 'Z', taille: 22 },
        { symbole: 'E', taille: 19 }, { symbole: 'P', taille: 16 }, { symbole: 'T', taille: 13 },
        { symbole: 'G', taille: 10 }, { symbole: 'M', taille: 7 }
    ];

    for (const u of unitesFormat) {
        if (longueur >= u.taille) {
            const rangSlicing = longueur - u.taille + 1;
            const partieEntiere = nette.substring(0, rangSlicing);
            const partieDecimale = nette.substring(rangSlicing, rangSlicing + 2);
            if (partieDecimale === "00") return `${partieEntiere} ${u.symbole}`;
            return `${partieEntiere},${partieDecimale} ${u.symbole}`;
        }
    }
    return BigInt(nette).toLocaleString('fr-FR');
}

// --- LOGIQUE POUR LES PRIMES ---
async function traiterEtEnvoyerPrimes() {
    const selectWebhookPrimes = document.getElementById("selectWebhookPrimes");
    const codeAcces = document.getElementById("codeAcces").value.trim();
    const grosTexte = document.getElementById("grosTexte").value.trim();
    const primeMaxSaisie = document.getElementById("primeMaxBase").value.trim();
    const exclureZeros = document.getElementById("exclureZeros").checked;
    const btn = document.getElementById("btnEnvoyerPrimes");

    let webhookUrl = "";
    if (codeAcces && DICTIONNAIRE_WEBHOOKS[codeAcces] && selectWebhookPrimes.value) {
        webhookUrl = selectWebhookPrimes.value;
    } else {
        afficherStatus("❌ Veuillez saisir un code d'accès valide.", "error");
        return;
    }

    if (!grosTexte) {
        afficherStatus("❌ Veuillez coller le tableau des primes.", "error");
        return;
    }

    let limiteBase = convertirEnBigInt(primeMaxSaisie);
    btn.disabled = true;
    afficherStatus("⏳ Analyse des primes...", "");

    try {
        const lines = grosTexte.split("\n");
        const primesCumulees = new Map();
        const occurrencesJoueurs = new Map();
        let sommeTotalePrimes = 0n;

        for (let i = 1; i < lines.length; i++) {
            let ligne = lines[i].trim();
            if (!ligne) continue;
            ligne = ligne.replace(/[\u00A0\u1680\u180E\u2000-\u200B\u202F\u205F\u3000\uFEFF]/g, " ");
            const morceaux = ligne.split(/\s+/).filter(m => m.length > 0); 
            if (morceaux.length < 5) continue;

            let prime = morceaux[morceaux.length - 1]; 
            let indexDirecteur = -1;
            for (let j = 0; j < morceaux.length; j++) {
                if (morceaux[j] === "Général" || morceaux[j] === "PDG" || morceaux[j] === "Directeur") indexDirecteur = j + 1;
            }
            if (indexDirecteur === -1 || indexDirecteur >= morceaux.length - 2) indexDirecteur = morceaux.length - 3;

            const finNom = morceaux.length - 2; 
            const directeur = morceaux.slice(indexDirecteur, finNom).join(" ").trim();
            if (!directeur) continue;

            let valeurPrimeNumerique = convertirEnBigInt(prime);
            sommeTotalePrimes += valeurPrimeNumerique;

            if (primesCumulees.has(directeur)) {
                primesCumulees.set(directeur, primesCumulees.get(directeur) + valeurPrimeNumerique);
                occurrencesJoueurs.set(directeur, occurrencesJoueurs.get(directeur) + 1);
            } else {
                primesCumulees.set(directeur, valeurPrimeNumerique);
                occurrencesJoueurs.set(directeur, 1);
            }
        }

        if (limiteBase > 0n) {
            let erreursPlafond = [];
            for (const [directeur, totalPrime] of primesCumulees) {
                const nbrOccurrences = BigInt(occurrencesJoueurs.get(directeur));
                const limitePersonnalisee = limiteBase * nbrOccurrences;
                if (totalPrime > limitePersonnalisee) {
                    erreursPlafond.push(`⚠️ **${directeur}** dépasse ! Reçu : \`${formaterGrandNombre(totalPrime.toString())}\` | Max : \`${formaterGrandNombre(limitePersonnalisee.toString())}\``);
                }
            }
            if (erreursPlafond.length > 0) {
                afficherStatus(`🛑 ENVOI BLOQUÉ - PLAFOND ATTEINT :\n\n${erreursPlafond.join("\n")}`, "error");
                btn.disabled = false;
                return;
            }
        }

        let listeTriees = Array.from(primesCumulees.entries()).sort((a, b) => (b[1] > a[1] ? 1 : b[1] < a[1] ? -1 : 0));
        let messageActuel = "💰 **Rapport des Primes des Directeurs :**\n\n";
        const messagesAEnvoyer = [];

        for (const [directeur, totalPrime] of listeTriees) {
            if (exclureZeros && totalPrime === 0n) continue;
            const ligneFormat = `👤 **${directeur}** ➔ \`${formaterGrandNombre(totalPrime.toString())} 💰\`\n`;
            if ((messageActuel + ligneFormat).length > 1800) {
                messagesAEnvoyer.push(messageActuel);
                messageActuel = "🔄 **Suite du rapport :**\n\n" + ligneFormat;
            } else messageActuel += ligneFormat;
        }

        const ligneTotal = `\n⚙️ **Somme totale des primes versées :** \`${formaterGrandNombre(sommeTotalePrimes.toString())} 💰\``;
        if ((messageActuel + ligneTotal).length > 1950) {
            messagesAEnvoyer.push(messageActuel);
            messageActuel = ligneTotal;
        } else {
            messageActuel += ligneTotal;
        }

        if (messageActuel && messageActuel.length > 45) messagesAEnvoyer.push(messageActuel);

        await envoyerSurDiscord(webhookUrl, messagesAEnvoyer, "Gestionnaire des Primes");
        afficherStatus("✅ Primes envoyées avec succès !", "success");
        document.getElementById("grosTexte").value = "";
    } catch (e) {
        afficherStatus(`❌ Erreur Primes : ${e.message}`, "error");
    } finally { btn.disabled = false; }
}

// --- LOGIQUE POUR LES FRAIS DE GESTION ---
async function traiterEtEnvoyerFrais() {
    const selectWebhookFrais = document.getElementById("selectWebhookFrais");
    const codeAcces = document.getElementById("codeAcces").value.trim();
    const texteFrais = document.getElementById("texteFrais").value.trim();
    const exclureZeros = document.getElementById("exclureZeros").checked;
    const btn = document.getElementById("btnEnvoyerFrais");

    let webhookUrl = "";
    if (codeAcces && DICTIONNAIRE_WEBHOOKS[codeAcces] && selectWebhookFrais.value) {
        webhookUrl = selectWebhookFrais.value;
    } else {
        afficherStatus("❌ Veuillez saisir un code d'accès valide.", "error");
        return;
    }

    if (!texteFrais) {
        afficherStatus("❌ Veuillez coller le tableau des Frais de Gestion.", "error");
        return;
    }

    btn.disabled = true;
    afficherStatus("⏳ Analyse des frais de gestion...", "");

    try {
        const lines = texteFrais.split("\n");
        const fraisParFiliale = new Map();
        let sommeTotaleFrais = 0n;

        for (let i = 1; i < lines.length; i++) {
            let ligne = lines[i].trim();
            if (!ligne) continue;

            const morceaux = ligne.split(/\s{2,}|\t/).filter(m => m.trim().length > 0);
            if (morceaux.length < 2) {
                const morceauxSecours = ligne.split(/\s+/);
                if (morceauxSecours.length >= 2) {
                    let montant = morceauxSecours[morceauxSecours.length - 1];
                    let filiale = morceauxSecours.slice(0, morceauxSecours.length - 1).join(" ");
                    let valeurFrais = convertirEnBigInt(montant);
                    fraisParFiliale.set(filiale, valeurFrais);
                    sommeTotaleFrais += valeurFrais;
                }
                continue;
            }

            let filiale = morceaux[0].trim();
            let montantStr = morceaux[morceaux.length - 1].trim();
            let valeurFrais = convertirEnBigInt(montantStr);
            fraisParFiliale.set(filiale, valeurFrais);
            sommeTotaleFrais += valeurFrais;
        }

        let listeFraisTriees = Array.from(fraisParFiliale.entries()).sort((a, b) => (b[1] > a[1] ? 1 : b[1] < a[1] ? -1 : 0));

        let messageActuel = "🏢 **Rapport des Frais de Gestion des Filiales :**\n\n";
        const messagesAEnvoyer = [];

        for (const [filiale, totalFrais] of listeFraisTriees) {
            if (exclureZeros && totalFrais === 0n) continue;

            const ligneFormat = `🏢 **${filiale}** ➔ \`${formaterGrandNombre(totalFrais.toString())} 💸\`\n`;
            if ((messageActuel + ligneFormat).length > 1800) {
                messagesAEnvoyer.push(messageActuel);
                messageActuel = "🔄 **Suite du rapport des frais :**\n\n" + ligneFormat;
            } else {
                messageActuel += ligneFormat;
            }
        }

        const ligneTotal = `\n📊 **Somme totale des frais de gestion :** \`${formaterGrandNombre(sommeTotaleFrais.toString())} 💸\``;
        if ((messageActuel + ligneTotal).length > 1950) {
            messagesAEnvoyer.push(messageActuel);
            messageActuel = ligneTotal;
        } else {
            messageActuel += ligneTotal;
        }

        if (messageActuel && messageActuel.length > 55) messagesAEnvoyer.push(messageActuel);

        if (messagesAEnvoyer.length === 0 || (messagesAEnvoyer.length === 1 && sommeTotaleFrais === 0n && exclureZeros)) {
            afficherStatus("⚠️ Rien à envoyer (toutes les valeurs sont à 0 ou tableau vide).", "error");
            btn.disabled = false;
            return;
        }

        await envoyerSurDiscord(webhookUrl, messagesAEnvoyer, "Gestionnaire Financier");
        afficherStatus("✅ Frais de gestion envoyés avec succès !", "success");
        document.getElementById("texteFrais").value = "";
    } catch (e) {
        afficherStatus(`❌ Erreur Frais : ${e.message}`, "error");
    } finally { btn.disabled = false; }
}

// --- SECTION 3 : CALCUL DES FRAIS DE GESTION PAR POURCENTAGE ---

// Convertit une chaîne en BigInt en conservant le signe (négatif possible pour une perte)
function convertirEnBigIntSigne(chaine) {
    let s = chaine.trim();
    if (!s) return 0n;
    const negatif = s.startsWith('-');
    if (negatif) s = s.slice(1);
    const valeur = convertirEnBigInt(s);
    return negatif ? -valeur : valeur;
}

// Analyse le tableau collé : Filiale | Trésorerie | Résultat d'exploitation | Résultat NET | Bénéfices ou pertes
function analyserTableauResultats(texte) {
    const lignes = texte.split("\n");
    const resultats = [];

    for (let i = 0; i < lignes.length; i++) {
        let ligne = lignes[i].trim();
        if (!ligne) continue;
        ligne = ligne.replace(/[\u00A0\u1680\u180E\u2000-\u200B\u202F\u205F\u3000\uFEFF]/g, " ");

        const tokens = ligne.split(/\s+/).filter(t => t.length > 0);
        if (tokens.length === 0) continue;

        // Ignore la ligne d'en-tête (ex: "Filiale Trésorerie Résultat d'exploitation ...")
        if (tokens[0].toLowerCase() === "filiale") continue;

        // Les 4 dernières valeurs sont les montants, le reste forme le nom de la filiale
        if (tokens.length < 5) continue;
        const montants = tokens.slice(-4);
        const filiale = tokens.slice(0, tokens.length - 4).join(" ").trim();
        if (!filiale) continue;

        resultats.push({
            filiale: filiale,
            tresorerie: convertirEnBigIntSigne(montants[0]),
            resultatExploitation: convertirEnBigIntSigne(montants[1]),
            resultatNet: convertirEnBigIntSigne(montants[2]),
            beneficePerte: convertirEnBigIntSigne(montants[3])
        });
    }
    return resultats;
}

// Applique un pourcentage (peut être décimal, ex: 12.5) à une valeur BigInt, en conservant le signe
function appliquerPourcentage(valeurBigInt, pourcentageFloat) {
    const PRECISION = 1000000n; // 6 décimales de précision sur le pourcentage
    const pourcentageEntier = BigInt(Math.round(pourcentageFloat * 1000000));
    return (valeurBigInt * pourcentageEntier) / (100n * PRECISION);
}

function calculerFraisParPourcentage() {
    const texte = document.getElementById("texteResultatsFiliales").value.trim();
    const pourcentageStr = document.getElementById("pourcentageFrais").value.trim();
    const zoneResultat = document.getElementById("zoneResultatCalcul");
    const sortieTextarea = document.getElementById("resultatFraisCalcules");

    if (!texte) {
        afficherStatus("❌ Veuillez coller le tableau des résultats (Filiale, Trésorerie, Résultat d'exploitation...).", "error");
        return;
    }
    if (!pourcentageStr) {
        afficherStatus("❌ Veuillez indiquer un pourcentage à appliquer.", "error");
        return;
    }

    const pourcentage = parseFloat(pourcentageStr.replace(",", "."));
    if (isNaN(pourcentage)) {
        afficherStatus("❌ Pourcentage invalide.", "error");
        return;
    }

    const donnees = analyserTableauResultats(texte);
    if (donnees.length === 0) {
        afficherStatus("❌ Aucune ligne valide détectée dans le tableau collé.", "error");
        zoneResultat.classList.add("hidden");
        return;
    }

    const lignesSortie = donnees.map(d => {
        const frais = appliquerPourcentage(d.resultatExploitation, pourcentage);
        return `${d.filiale}\t${frais.toString()}`;
    });

    sortieTextarea.value = lignesSortie.join("\n");
    zoneResultat.classList.remove("hidden");
    afficherStatus(`✅ ${donnees.length} filiale(s) calculée(s) avec ${pourcentage}% du Résultat d'exploitation. Copiez le résultat pour l'importer.`, "success");
}

async function copierResultatFrais() {
    const texte = document.getElementById("resultatFraisCalcules").value;
    if (!texte) return;

    try {
        await navigator.clipboard.writeText(texte);
        afficherStatus("📋 Résultat copié dans le presse-papiers ! Collez-le dans la fenêtre d'import des Frais de Gestion.", "success");
    } catch (e) {
        const zone = document.getElementById("resultatFraisCalcules");
        zone.select();
        try {
            document.execCommand("copy");
            afficherStatus("📋 Résultat copié (méthode de secours).", "success");
        } catch (e2) {
            afficherStatus("❌ Impossible de copier automatiquement. Sélectionnez le texte et copiez-le manuellement.", "error");
        }
    }
}

function insererDansChampFrais() {
    const texteCalcule = document.getElementById("resultatFraisCalcules").value;
    if (!texteCalcule) return;

    document.getElementById("texteFrais").value = "Filiale\tFrais de gestion\n" + texteCalcule;
    afficherStatus("➡️ Résultat inséré dans le champ Frais de Gestion (Section 2). Vous pouvez maintenant l'envoyer.", "success");
    document.getElementById("texteFrais").scrollIntoView({ behavior: "smooth", block: "center" });
}

// --- SECTION 4 : CLASSEMENT PAR RÉSULTAT D'EXPLOITATION ---
async function genererEtEnvoyerClassement() {
    const selectWebhookClassement = document.getElementById("selectWebhookClassement");
    const codeAcces = document.getElementById("codeAcces").value.trim();
    const texte = document.getElementById("texteResultatsFiliales").value.trim();
    const btn = document.getElementById("btnEnvoyerClassement");

    let webhookUrl = "";
    if (codeAcces && DICTIONNAIRE_WEBHOOKS[codeAcces] && selectWebhookClassement.value) {
        webhookUrl = selectWebhookClassement.value;
    } else if (codeAcces && DICTIONNAIRE_WEBHOOKS[codeAcces]) {
        afficherStatus("❌ Aucun salon contenant \"classement\" dans son nom n'est configuré pour ce code d'accès.", "error");
        return;
    } else {
        afficherStatus("❌ Veuillez saisir un code d'accès valide.", "error");
        return;
    }

    if (!texte) {
        afficherStatus("❌ Veuillez coller le tableau des résultats dans la Section 3 ci-dessus.", "error");
        return;
    }

    btn.disabled = true;
    afficherStatus("⏳ Génération du classement...", "");

    try {
        const donnees = analyserTableauResultats(texte);
        if (donnees.length === 0) {
            afficherStatus("❌ Aucune ligne valide détectée dans le tableau collé.", "error");
            btn.disabled = false;
            return;
        }

        const classees = donnees.slice().sort((a, b) => {
            if (a.resultatExploitation > b.resultatExploitation) return -1;
            if (a.resultatExploitation < b.resultatExploitation) return 1;
            return 0;
        });

        const medailles = ["🥇", "🥈", "🥉"];
        let messageActuel = "🏆 **Classement — Résultat d'exploitation**\n\n";
        const messagesAEnvoyer = [];

        classees.forEach((d, index) => {
            const rangAffiche = index < 3 ? medailles[index] : `${index + 1}.`;
            const estNegatif = d.resultatExploitation < 0n;
            const valeurAbsolue = estNegatif ? -d.resultatExploitation : d.resultatExploitation;
            const montantFormate = valeurAbsolue === 0n
                ? "0 EØ"
                : `${formaterGrandNombre(valeurAbsolue.toString())}Ø`;
            const signe = estNegatif ? "-" : "";
            const ligneFormat = `${rangAffiche} **${d.filiale}**\n📊 Re : **${signe}${montantFormate}**\n\n`;

            if ((messageActuel + ligneFormat).length > 1900) {
                messagesAEnvoyer.push(messageActuel);
                messageActuel = "🔄 **Suite du classement :**\n\n" + ligneFormat;
            } else {
                messageActuel += ligneFormat;
            }
        });

        if (messageActuel.trim()) messagesAEnvoyer.push(messageActuel);

        await envoyerSurDiscord(webhookUrl, messagesAEnvoyer, "Classement des Filiales");
        afficherStatus(`✅ Classement envoyé avec succès ! (${donnees.length} filiale(s))`, "success");
    } catch (e) {
        afficherStatus(`❌ Erreur Classement : ${e.message}`, "error");
    } finally {
        btn.disabled = false;
    }
}

// Fonction globale d'envoi
async function envoyerSurDiscord(url, paquetsMessages, nomRobot) {
    for (const msgContent of paquetsMessages) {
        const reponse = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: nomRobot,
                avatar_url: "https://i.imgur.com/AfFp7pu.png",
                content: msgContent
            })
        });
        if (!reponse.ok) throw new Error(`Erreur Discord : ${reponse.statusText}`);
        await new Promise(r => setTimeout(r, 250));
    }
}

function afficherStatus(message, type) {
    const statusBox = document.getElementById("statusBox");
    statusBox.innerText = message;
    statusBox.className = "status " + type;
    statusBox.style.display = "block";
    if(type === "success") statusBox.style.backgroundColor = "#2e7d32";
    if(type === "error") statusBox.style.backgroundColor = "#d32f2f";
}
