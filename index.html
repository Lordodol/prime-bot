<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur de Primes Discord</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2f3136;
            color: #dcddde;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #36393f;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 700px;
        }
        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #b9bbbe;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            cursor: pointer;
            font-weight: bold;
            color: #b9bbbe;
        }
        .checkbox-container input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        input[type="text"], input[type="password"], select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #202225;
            border: 1px solid #222;
            border-radius: 4px;
            color: #fff;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 14px;
        }
        select option {
            background-color: #2f3136;
            color: #fff;
        }
        textarea {
            resize: vertical;
            min-height: 200px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #5865f2;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #5865f2;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4752c4;
        }
        button:disabled {
            background-color: #4f545c;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            display: none;
            white-space: pre-line;
        }
        .success { background-color: #2e7d32; color: #fff; }
        .error { background-color: #d32f2f; color: #fff; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Analyseur & Envoi de Primes</h1>
    
    <label for="codeAcces">🔑 Code d'accès Webhook :</label>
    <input type="password" id="codeAcces" placeholder="Entrez votre code secret (ex: 1234)" oninput="detecterCode()">

    <div id="zoneSalons" class="hidden">
        <label for="selectWebhook">📁 Salon de destination :</label>
        <select id="selectWebhook"></select>
    </div>

    <label for="primeMaxBase">💰 Prime Max par poste (ex: 5M, 10G, 5000000) :</label>
    <input type="text" id="primeMaxBase" placeholder="Laissez vide pour désactiver le contrôle">

    <label class="checkbox-container">
        <input type="checkbox" id="exclureZeros" checked>
        Masquer les joueurs qui ont 0 de prime
    </label>

    <label for="grosTexte">📝 Coller le tableau des données ici :</label>
    <textarea id="grosTexte" placeholder="Filiale    Poste    Directeur    Prime Max    Prime..."></textarea>

    <button id="btnEnvoyer" onclick="traiterEtEnvoyer()">🚀 Analyser et Envoyer sur Discord</button>

    <div id="statusBox" class="status"></div>
</div>

<script>
// --- CONFIGURATION DES CODES ET DES OPTIONS DE WEBHOOKS ---
const DICTIONNAIRE_WEBHOOKS = {
    "curly": [
        { nom: "Prime Patrimonia", url: "https://discordapp.com/api/webhooks/1524339415567171664/jI_sV3e13fIWATIFPzIc4qMqI3gBZarIi_vXe2lUSYWj8UFothtVGR49NaaM7b1QYzcx" }
    ],
    "lion": [
        { nom: "🔒 Zone Staff", url: "https://discord.com/api/webhooks/VALEUR_EXEMPLE_B1" },
        { nom: "📈 Logs Système", url: "https://discord.com/api/webhooks/VALEUR_EXEMPLE_B2" },
        { nom: "💬 Discussion", url: "https://discord.com/api/webhooks/VALEUR_EXEMPLE_B3" }
    ]
};

// Liste officielle des unités utilisées dans ton script avec leur puissance de 10
const CONFIG_UNITES = [
    { symbole: 'D', taille: 45 },
    { symbole: 'N', taille: 42 },
    { symbole: 'X', taille: 39 },
    { symbole: 'S', taille: 36 },
    { symbole: 'U', taille: 33 },
    { symbole: 'Q', taille: 30 },
    { symbole: 'R', taille: 27 },
    { symbole: 'Y', taille: 24 },
    { symbole: 'Z', taille: 21 },
    { symbole: 'E', taille: 18 },
    { symbole: 'P', taille: 15 },
    { symbole: 'T', taille: 12 },
    { symbole: 'G', taille: 9 },
    { symbole: 'M', taille: 6 } // Ajout de M pour millions au cas où
];

// Convertit une chaîne avec unité (ex: "1,5G" ou "500M") en BigInt pur
function convertirEnBigInt(chaine) {
    let nettoye = chaine.trim().toUpperCase().replace(/,/g, '.');
    if (!nettoye || nettoye === '0' || nettoye === '-' || nettoye === '.') return 0n;

    // Chercher si la chaîne se termine par une unité connue
    for (const u of CONFIG_UNITES) {
        if (nettoye.endsWith(u.symbole)) {
            let valeurNum = nettoye.slice(0, -1).trim();
            let floatValeur = parseFloat(valeurNum);
            if (isNaN(floatValeur)) return 0n;

            // Utilisation de la notation scientifique pour gérer les décimales proprement avec BigInt
            let shift = u.taille;
            if (valeurNum.includes('.')) {
                let decimales = valeurNum.split('.')[1].length;
                floatValeur = floatValeur * Math.pow(10, decimales);
                shift -= decimales;
            }
            
            if (shift < 0) return BigInt(Math.round(parseFloat(valeurNum) * Math.pow(10, u.taille)));
            return BigInt(Math.round(floatValeur)) * (10n ** BigInt(shift));
        }
    }

    // Si aucune unité n'est trouvée, on nettoie tout sauf les chiffres
    let chiffresSeuls = nettoye.replace(/[^0-9]/g, '');
    return chiffresSeuls ? BigInt(chiffresSeuls) : 0n;
}

// Fonction déclenchée en temps réel quand on écrit le code
function detecterCode() {
    const code = document.getElementById("codeAcces").value.trim();
    const zoneSalons = document.getElementById("zoneSalons");
    const selectWebhook = document.getElementById("selectWebhook");
    
    if (DICTIONNAIRE_WEBHOOKS[code]) {
        selectWebhook.innerHTML = ""; 
        
        DICTIONNAIRE_WEBHOOKS[code].forEach((salon) => {
            const opt = document.createElement("option");
            opt.value = salon.url;
            opt.textContent = salon.nom;
            selectWebhook.appendChild(opt);
        });
        
        zoneSalons.classList.remove("hidden"); 
    } else {
        zoneSalons.classList.add("hidden"); 
        selectWebhook.innerHTML = "";
    }
}

// Fonction pour abréger les très grands nombres de manière lisible avec décimales
function formaterGrandNombre(chaineNombre) {
    const nette = chaineNombre.replace(/[^0-9]/g, '');
    if (!nette || nette === '0') return "Aucune (0)";

    const longueur = nette.length;

    const unitesFormat = [
        { symbole: 'D', taille: 46 }, { symbole: 'N', taille: 43 }, { symbole: 'X', taille: 40 },
        { symbole: 'S', taille: 37 }, { symbole: 'U', taille: 34 }, { symbole: 'Q', taille: 31 },
        { symbole: 'R', taille: 28 }, { symbole: 'Y', taille: 25 }, { symbole: 'Z', taille: 22 },
        { symbole: 'E', taille: 19 }, { symbole: 'P', taille: 16 }, { symbole: 'T', taille: 13 },
        { symbole: 'G', taille: 10 }
    ];

    for (const u of unitesFormat) {
        if (longueur >= u.taille) {
            const rangSlicing = longueur - u.taille + 1;
            const partieEntiere = nette.substring(0, rangSlicing);
            const partieDecimale = nette.substring(rangSlicing, rangSlicing + 2);
            
            if (partieDecimale === "00") {
                return `${partieEntiere} ${u.symbole}`;
            }
            return `${partieEntiere},${partieDecimale} ${u.symbole}`;
        }
    }

    return BigInt(nette).toLocaleString('fr-FR');
}

async function traiterEtEnvoyer() {
    const selectWebhook = document.getElementById("selectWebhook");
    const codeAcces = document.getElementById("codeAcces").value.trim();
    const grosTexte = document.getElementById("grosTexte").value.trim();
    const primeMaxSaisie = document.getElementById("primeMaxBase").value.trim();
    const exclureZeros = document.getElementById("exclureZeros").checked;
    const btn = document.getElementById("btnEnvoyer");
    const statusBox = document.getElementById("statusBox");

    let webhookUrl = "";
    if (codeAcces && DICTIONNAIRE_WEBHOOKS[codeAcces] && selectWebhook.value) {
        webhookUrl = selectWebhook.value;
    } else {
        afficherStatus("❌ Veuillez saisir un code d'accès valide pour déverrouiller un salon de destination.", "error");
        return;
    }

    if (!grosTexte) {
        afficherStatus("❌ Veuillez coller du texte à analyser.", "error");
        return;
    }

    // Traitement de la limite base (prend en charge les unités à la saisie)
    let limiteBase = convertirEnBigInt(primeMaxSaisie);

    btn.disabled = true;
    afficherStatus("⏳ Analyse en cours...", "");
    statusBox.style.backgroundColor = "#72767d";

    try {
        const lines = grosTexte.split("\n");
        
        const primesCumulees = new Map();
        const occurrencesJoueurs = new Map();

        // Étape 1 : Analyse et cumul
        for (let i = 1; i < lines.length; i++) {
            let ligne = lines[i].trim();
            if (!ligne) continue;

            ligne = ligne.replace(/[\u00A0\u1680\u180E\u2000-\u200B\u202F\u205F\u3000\uFEFF]/g, " ");

            const morceaux = ligne.split(/\s+/).filter(m => m.length > 0); 
            if (morceaux.length < 5) continue;

            let prime = morceaux[morceaux.length - 1]; 

            let indexDirecteur = -1;
            for (let j = 0; j < morceaux.length; j++) {
                if (morceaux[j] === "Général" || morceaux[j] === "PDG" || morceaux[j] === "Directeur") {
                    indexDirecteur = j + 1;
                }
            }

            if (indexDirecteur === -1 || indexDirecteur >= morceaux.length - 2) {
                indexDirecteur = morceaux.length - 3;
            }

            const finNom = morceaux.length - 2; 
            const directeurMorceaux = morceaux.slice(indexDirecteur, finNom);
            const directeur = directeurMorceaux.join(" ").trim();

            if (!directeur) continue;

            let valeurPrimeNumerique = convertirEnBigInt(prime);

            if (primesCumulees.has(directeur)) {
                primesCumulees.set(directeur, primesCumulees.get(directeur) + valeurPrimeNumerique);
                occurrencesJoueurs.set(directeur, occurrencesJoueurs.get(directeur) + 1);
            } else {
                primesCumulees.set(directeur, valeurPrimeNumerique);
                occurrencesJoueurs.set(directeur, 1);
            }
        }

        // Étape 2 : Vérification du plafond max
        if (limiteBase > 0n) {
            let erreursPlafond = [];

            for (const [directeur, totalPrime] of primesCumulees) {
                const nbrOccurrences = BigInt(occurrencesJoueurs.get(directeur));
                const limitePersonnalisee = limiteBase * nbrOccurrences;

                if (totalPrime > limitePersonnalisee) {
                    const totalFormate = formaterGrandNombre(totalPrime.toString());
                    const limiteFormatee = formaterGrandNombre(limitePersonnalisee.toString());
                    erreursPlafond.push(`⚠️ **${directeur}** dépasse le plafond ! \n   👉 Reçu : \`${totalFormate}\` | Max autorisé (x${nbrOccurrences}) : \`${limiteFormatee}\``);
                }
            }

            if (erreursPlafond.length > 0) {
                afficherStatus(`🛑 ENVOI BLOQUÉ - DÉPASSEMENT DE PRIME MAX :\n\n${erreursPlafond.join("\n\n")}\n\nVeuillez corriger le tableau avant de renvoyer.`, "error");
                btn.disabled = false;
                return;
            }
        }

        // Étape 3 : Tri décroissant
        let listeTriees = Array.from(primesCumulees.entries());
        listeTriees.sort((a, b) => {
            if (b[1] > a[1]) return 1;
            if (b[1] < a[1]) return -1;
            return 0;
        });

        // Étape 4 : Construction des messages Discord
        let messageActuel = "💰 **Rapport des Primes des Directeurs :**\n\n";
        const messagesAEnvoyer = [];

        for (const [directeur, totalPrime] of listeTriees) {
            if (exclureZeros && totalPrime === 0n) {
                continue;
            }

            let primeFormatee = "";
            if (totalPrime === 0n) {
                primeFormatee = "Aucune (0)";
            } else {
                primeFormatee = formaterGrandNombre(totalPrime.toString());
            }

            const ligneFormat = `👤 **${directeur}** ➔ \`${primeFormatee} 💰\`\n`;

            if ((messageActuel + ligneFormat).length > 1900) {
                messagesAEnvoyer.push(messageActuel);
                messageActuel = "🔄 **Suite du rapport :**\n\n" + ligneFormat;
            } else {
                messageActuel += ligneFormat;
            }
        }
        
        if (messageActuel && messageActuel !== "💰 **Rapport des Primes des Directeurs :**\n\n" && messageActuel !== "🔄 **Suite du rapport :**\n\n") {
            messagesAEnvoyer.push(messageActuel);
        }

        if (messagesAEnvoyer.length === 0) {
            afficherStatus("⚠️ Aucune donnée valide n'a pu être extraite ou tous les joueurs ont 0 de prime.", "error");
            btn.disabled = false;
            return;
        }

        // Étape 5 : Envoi vers Discord
        afficherStatus("⏳ Envoi sur Discord...", "");
        for (const msgContent of messagesAEnvoyer) {
            const reponse = await fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: "Gestionnaire des Primes",
                    avatar_url: "https://i.imgur.com/AfFp7pu.png",
                    content: msgContent
                })
            });

            if (!reponse.ok) {
                throw new Error(`Erreur Discord : ${reponse.statusText}`);
            }
            await new Promise(resolve => setTimeout(resolve, 250));
        }

        afficherStatus("✅ Tout a été envoyé avec succès sur Discord !", "success");
        document.getElementById("grosTexte").value = ""; 

    } catch (erreur) {
        afficherStatus(`❌ Erreur lors de l'envoi : ${erreur.message}`, "error");
    } finally {
        btn.disabled = false;
    }
}

function afficherStatus(message, type) {
    const statusBox = document.getElementById("statusBox");
    statusBox.innerText = message;
    statusBox.className = "status " + type;
    statusBox.style.display = "block";
}
</script>

</body>
</html>
